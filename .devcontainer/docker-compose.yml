services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/ai_shell:cached
      - aishell-data:/home/node/.aishell
    environment:
      AISHELL_MODE: standalone
      AISHELL_DATA_DIR: /home/node/.aishell
    ports:
      - "5174:5174"
      - "5175:5175"
    command: sleep infinity

  postgres:
    profiles: ["db-helper"]
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: aishell
      POSTGRES_PASSWORD: aishell
      POSTGRES_DB: aishell_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  aishell-data:
  postgres-data:
